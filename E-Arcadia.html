<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-Arcadia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
:root{
  --ink:#1A1147;--ink2:#2B1D74;--screen:#0F0B2E;
  --mag:#FF4F8B;--yel:#FFC83D;--cya:#35E0D0;--cream:#FFF4DC;--grn:#7BE06B;
  --display:'Bungee',Impact,'Arial Black',sans-serif;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--body);color:var(--cream);min-height:100vh;padding:0 14px 40px;
  background-color:var(--ink);
  background-image:
    radial-gradient(circle at 20% 30%,rgba(53,224,208,.20) 0 3px,transparent 4px),
    radial-gradient(circle at 70% 72%,rgba(255,79,139,.20) 0 3px,transparent 4px),
    linear-gradient(135deg,transparent 47%,rgba(255,200,61,.10) 48% 52%,transparent 53%);
  background-size:84px 84px,84px 84px,56px 56px;
}
:focus-visible{outline:3px solid var(--yel);outline-offset:3px}

/* Marquee sign */
.sign{
  position:relative;max-width:780px;margin:26px auto 22px;padding:40px 18px 34px;text-align:center;
  background:var(--mag);border:6px solid var(--cream);border-radius:28px;
  box-shadow:0 0 0 6px var(--ink),0 16px 0 -2px rgba(0,0,0,.35);
}
.sign::before,.sign::after{
  content:"";position:absolute;left:16px;right:16px;height:14px;
  background:radial-gradient(circle,var(--yel) 0 4px,transparent 5px) 0 50%/24px 14px repeat-x;
  animation:blink 1.2s steps(1) infinite;
}
.sign::before{top:10px}
.sign::after{bottom:10px;animation-direction:reverse}
@keyframes blink{50%{opacity:.2}}
.sign h1{
  font-family:var(--display);font-weight:400;font-size:clamp(2.7rem,12vw,5.4rem);line-height:1;
  color:var(--cream);text-shadow:3px 3px 0 var(--ink),6px 6px 0 var(--cya);
}
.sign p{margin:18px auto 0;max-width:36ch;font-size:1.05rem;font-weight:500;color:#fff;line-height:1.45}

/* Controls */
.bar-top{max-width:1040px;margin:0 auto 18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;flex:1}
.chip,.sound{
  font:600 .95rem var(--body);color:var(--cream);background:var(--ink2);border:2px solid transparent;
  border-radius:999px;padding:8px 16px;cursor:pointer;min-height:40px;
}
.chip[aria-pressed="true"]{background:var(--yel);color:var(--ink)}
.sound{background:transparent;border-color:var(--ink2)}

/* Game cabinets */
.grid{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.cab{
  --c:var(--cya);
  display:flex;flex-direction:column;text-align:left;font:inherit;color:#2A1B66;cursor:pointer;
  background:var(--cream);border:0;padding:0;overflow:hidden;
  border-radius:26px 26px 10px 10px;box-shadow:0 6px 0 rgba(0,0,0,.35);
  transition:transform .12s;
}
.cab:hover{transform:translateY(-4px)}
.cab:active{transform:translateY(1px)}
.scr{background:var(--c);padding:12px 12px 10px;display:block}
.ico{
  display:grid;place-items:center;height:92px;border-radius:14px;background:var(--screen);
  font-size:3rem;box-shadow:inset 0 0 0 3px rgba(255,255,255,.08),0 0 22px -4px var(--c);
}
.nm{font-family:var(--display);font-size:1.15rem;padding:12px 14px 0;color:var(--ink)}
.ds{padding:4px 14px 0;font-size:.9rem;line-height:1.4;flex:1}
.ft{display:flex;justify-content:space-between;gap:8px;padding:12px 14px 14px;font-size:.8rem;font-weight:700;color:#5b4a99}
.tag{background:var(--c);color:var(--ink);border-radius:999px;padding:2px 10px}

footer{max-width:1040px;margin:34px auto 0;text-align:center;font-size:.9rem;color:#B9AEF0}

/* Player overlay */
.ov{position:fixed;inset:0;z-index:10;background:rgba(10,6,32,.92);display:none;overflow:auto;padding:12px}
.ov.open{display:grid;place-items:center}
.win{--c:var(--cya);width:min(100%,580px);background:var(--c);border-radius:24px;padding:10px;box-shadow:0 10px 0 rgba(0,0,0,.4)}
.top{display:flex;align-items:center;gap:8px;padding:2px 4px 10px;color:var(--ink)}
.top h2{font-family:var(--display);font-weight:400;font-size:1.15rem;flex:1;min-width:0}
.pill{background:var(--ink);color:var(--cream);border-radius:10px;padding:3px 10px;font-size:.72rem;font-weight:500;text-align:center;line-height:1.25;min-width:54px}
.pill b{display:block;font-size:1.05rem;color:var(--yel)}
.ib{width:42px;height:42px;border:0;border-radius:12px;background:var(--ink);color:var(--cream);font-size:1.2rem;cursor:pointer}
.screen{position:relative;background:var(--screen);border-radius:14px;padding:10px;min-height:260px;display:grid;align-content:center}
.hint{color:var(--ink);font-weight:500;font-size:.88rem;text-align:center;padding:10px 4px 2px}
.end{position:absolute;inset:0;border-radius:14px;background:rgba(15,11,46,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}
.end h3{font-family:var(--display);font-weight:400;font-size:1.6rem;color:var(--yel)}
.end .big{font-size:2.4rem;font-weight:700}
.end .new{color:var(--cya);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.btn{font:700 1rem var(--body);color:var(--ink);background:var(--yel);border:0;border-radius:12px;padding:11px 20px;cursor:pointer;box-shadow:0 4px 0 #b88a10}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b88a10}
.btn.alt{background:var(--cream);box-shadow:0 4px 0 #b9a77c}

.dpad{display:none;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:6px;justify-content:center;margin-top:12px}
.dpad.on{display:grid}
@media (pointer:fine){.dpad.on{display:none}}
.dpad button{border:0;border-radius:14px;background:var(--ink);color:var(--cream);font-size:1.3rem;touch-action:manipulation}
.dpad [data-d=up]{grid-column:2;grid-row:1}
.dpad [data-d=left]{grid-column:1;grid-row:2}
.dpad [data-d=down]{grid-column:2;grid-row:2}
.dpad [data-d=right]{grid-column:3;grid-row:2}

/* In-game DOM pieces */
.msg{text-align:center;color:var(--cream);margin:2px 0 10px;font-weight:500;min-height:1.4em}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,300px,46vh);margin:0 auto}
.tc{aspect-ratio:1;border:0;border-radius:12px;background:var(--ink2);font:2.4rem var(--display);color:var(--cream);cursor:pointer}
.tc.x{color:var(--cya)}.tc.o{color:var(--mag)}
.wm{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,360px,50vh);margin:0 auto}
.hole{aspect-ratio:1;border:0;border-radius:50%;background:radial-gradient(#000 0 52%,#4a331f 53%);overflow:hidden;cursor:pointer;display:grid;place-items:end center;padding:0;touch-action:manipulation}
.hole span{font-size:clamp(2rem,9vw,3.2rem);line-height:1;transform:translateY(115%);transition:transform .08s}
.hole.up span{transform:translateY(6%)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(100%,360px,52vh);margin:0 auto}
.card{aspect-ratio:1;border:0;border-radius:12px;background:var(--mag);color:#fff;font-size:1.8rem;cursor:pointer;font-weight:700}
.card.f{background:var(--cream)}.card.m{background:var(--cya)}
.g2048{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(100%,360px,52vh);margin:0 auto;touch-action:none;background:#1b1450;padding:8px;border-radius:12px}
.t{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-weight:700}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(100%,340px,46vh);margin:0 auto}
.pad{aspect-ratio:1;border:0;border-radius:18px;background:var(--p);opacity:.45;cursor:pointer;transition:opacity .08s,transform .08s}
.pad.lit{opacity:1;transform:scale(1.03);box-shadow:0 0 30px var(--p)}
.qd{width:100%;min-height:min(46vh,320px);border:0;border-radius:16px;display:grid;place-content:center;gap:8px;text-align:center;color:#fff;cursor:pointer;padding:16px;touch-action:manipulation}
.qd b{font:1.9rem var(--display);font-weight:400}
.qd span{opacity:.92}
.qd.red{background:#D93B5A}.qd.green{background:#2DBE60}.qd.blue{background:var(--ink2)}

@media (prefers-reduced-motion:reduce){
  .sign::before,.sign::after{animation:none}
  .cab,.hole span,.pad{transition:none}
}
</style>
</head>
<body>

<header class="sign">
  <h1>E-Arcadia</h1>
  <p><span id="count">12</span> free games. Pick a cabinet, play, and beat your best score.</p>
</header>

<div class="bar-top">
  <div class="chips" id="chips" role="group" aria-label="Filter games"></div>
  <button class="sound" id="mute" type="button">Sound on</button>
</div>

<main class="grid" id="grid"></main>

<footer>Best scores are saved on this device. Nothing to install, no sign-in.</footer>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="title">
  <div class="win" id="win">
    <div class="top">
      <h2 id="title"></h2>
      <div class="pill">Score<b id="sc">0</b></div>
      <div class="pill">Best<b id="bst">0</b></div>
      <button class="ib" id="restart" type="button" aria-label="Restart game">&#8635;</button>
      <button class="ib" id="close" type="button" aria-label="Close game">&#10005;</button>
    </div>
    <div class="screen">
      <div id="stage"></div>
      <div class="end" id="end" hidden>
        <h3>Game over</h3>
        <p id="emsg"></p>
        <div class="big" id="escore">0</div>
        <p class="new" id="enew" hidden>New best score!</p>
        <div class="row">
          <button class="btn" id="again" type="button">Play again</button>
          <button class="btn alt" id="back" type="button">All games</button>
        </div>
      </div>
    </div>
    <p class="hint" id="hint"></p>
    <div class="dpad" id="dpad">
      <button type="button" data-d="up" aria-label="Up">&#9650;</button>
      <button type="button" data-d="left" aria-label="Left">&#9664;</button>
      <button type="button" data-d="down" aria-label="Down">&#9660;</button>
      <button type="button" data-d="right" aria-label="Right">&#9654;</button>
    </div>
  </div>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- storage (falls back to memory if the browser blocks it) ---------- */
const mem={};
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
};
const best=id=>+store.get('earcadia-best-'+id)||0;

/* ---------- sound ---------- */
let muted=false,actx;
function beep(f=440,d=.1,type='square',v=.05){
  if(muted)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.value=f;g.gain.value=v;
    o.connect(g);g.connect(actx.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.stop(actx.currentTime+d);
  }catch(e){}
}
$('#mute').onclick=e=>{muted=!muted;e.target.textContent=muted?'Sound off':'Sound on'};

/* ---------- game shell ---------- */
const ov=$('#ov'),stage=$('#stage'),end=$('#end'),dpad=$('#dpad');
let cur=null,ctx=null;
const KEYMAP={w:'ArrowUp',s:'ArrowDown',a:'ArrowLeft',d:'ArrowRight'};
const norm=k=>KEYMAP[k.toLowerCase()]||k;

function mk(){
  const cl=[];
  const k={
    cl,el:stage,s:0,done:false,
    score(n){k.s=n;$('#sc').textContent=n},
    on(t,ty,fn,o){t.addEventListener(ty,fn,o);cl.push(()=>t.removeEventListener(ty,fn,o))},
    key(down,up){
      const d=e=>{const n=norm(e.key);if(n.startsWith('Arrow')||n===' ')e.preventDefault();if(down)down(n,e)};
      const u=e=>{if(up)up(norm(e.key),e)};
      addEventListener('keydown',d);addEventListener('keyup',u);
      cl.push(()=>{removeEventListener('keydown',d);removeEventListener('keyup',u)});
    },
    loop(fn){
      let id,last=performance.now(),stop=false;
      const f=t=>{if(stop)return;const dt=Math.min(.05,(t-last)/1000);last=t;fn(dt);if(!stop)id=requestAnimationFrame(f)};
      id=requestAnimationFrame(f);
      cl.push(()=>{stop=true;cancelAnimationFrame(id)});
    },
    timer(fn,ms){const id=setInterval(fn,ms);cl.push(()=>clearInterval(id));return id},
    timeout(fn,ms){const id=setTimeout(fn,ms);cl.push(()=>clearTimeout(id));return id},
    canvas(w,h){
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.style.cssText=`display:block;margin:0 auto;touch-action:none;border-radius:8px;width:min(100%,${52*w/h}vh);height:auto;aspect-ratio:${w}/${h};background:#0F0B2E`;
      stage.appendChild(c);
      return {c,x:c.getContext('2d')};
    },
    pos(c,e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}},
    dpad(cb){
      dpad.classList.add('on');
      dpad.onpointerdown=e=>{const b=e.target.closest('button');if(b){e.preventDefault();cb(b.dataset.d)}};
    },
    over(msg=''){
      if(k.done)return;k.done=true;
      cl.splice(0).forEach(f=>f());
      dpad.classList.remove('on');dpad.onpointerdown=null;
      const b=best(cur.id),nb=k.s>b;
      if(nb)store.set('earcadia-best-'+cur.id,k.s);
      $('#bst').textContent=Math.max(b,k.s);
      $('#emsg').textContent=msg;$('#escore').textContent=k.s;$('#enew').hidden=!nb;
      end.hidden=false;
      beep(nb?880:196,.25,'triangle',.08);
    }
  };
  return k;
}
function stop(){
  if(ctx)ctx.cl.splice(0).forEach(f=>f());
  dpad.classList.remove('on');dpad.onpointerdown=null;
}
function run(){
  stop();stage.innerHTML='';end.hidden=true;
  ctx=mk();$('#sc').textContent=0;$('#bst').textContent=best(cur.id);
  cur.start(ctx);
}
function openGame(g){
  cur=g;$('#win').style.setProperty('--c',g.color);
  $('#title').textContent=g.name;$('#hint').textContent=g.hint;
  ov.classList.add('open');document.body.style.overflow='hidden';
  run();$('#close').focus();
}
function closeGame(){
  stop();ov.classList.remove('open');document.body.style.overflow='';stage.innerHTML='';render();
}
$('#restart').onclick=run;$('#again').onclick=run;
$('#close').onclick=closeGame;$('#back').onclick=closeGame;
addEventListener('keydown',e=>{if(e.key==='Escape'&&ov.classList.contains('open'))closeGame()});

/* ======================= GAMES ======================= */

/* 1. Snake */
function snake(k){
  const N=20,S=24,{c,x}=k.canvas(N*S,N*S);
  let sn=[{x:10,y:10},{x:9,y:10},{x:8,y:10}],dir=[1,0],q=[],sc=0,acc=0,food;
  const spot=()=>{let p;do{p={x:Math.random()*N|0,y:Math.random()*N|0}}while(sn.some(s=>s.x===p.x&&s.y===p.y));return p};
  food=spot();
  const M={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
  const turn=d=>{
    const m=M[d];if(!m)return;
    const l=q.length?q[q.length-1]:dir;
    if(m[0]+l[0]===0&&m[1]+l[1]===0)return;
    if(q.length<2)q.push(m);
  };
  const draw=()=>{
    x.fillStyle='#0F0B2E';x.fillRect(0,0,c.width,c.height);
    x.fillStyle='rgba(255,255,255,.04)';
    for(let i=0;i<N;i++)for(let j=0;j<N;j++)if((i+j)%2)x.fillRect(i*S,j*S,S,S);
    x.font=(S-4)+'px serif';x.textAlign='center';x.textBaseline='middle';
    x.fillText('🍎',food.x*S+S/2,food.y*S+S/2+1);
    sn.forEach((s,i)=>{x.fillStyle=i?'#35E0D0':'#FFC83D';x.beginPath();x.roundRect(s.x*S+2,s.y*S+2,S-4,S-4,6);x.fill()});
  };
  const tick=()=>{
    if(q.length)dir=q.shift();
    const h={x:sn[0].x+dir[0],y:sn[0].y+dir[1]};
    if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(s=>s.x===h.x&&s.y===h.y)){draw();k.over('You crashed');return}
    sn.unshift(h);
    if(h.x===food.x&&h.y===food.y){sc+=10;k.score(sc);beep(660,.08);food=spot()}else sn.pop();
    draw();
  };
  k.key(turn);k.dpad(turn);
  let sx=0,sy=0;
  k.on(c,'pointerdown',e=>{sx=e.clientX;sy=e.clientY});
  k.on(c,'pointerup',e=>{
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;
    turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
  });
  k.loop(dt=>{acc+=dt;if(acc>=Math.max(.06,.14-sc*.0008)){acc=0;tick()}});
  draw();
}

/* 2. Pong */
function pong(k){
  const W=480,H=320,ph=60,{c,x}=k.canvas(W,H);
  let py=H/2,ay=H/2,b,sc=0,miss=0;const keys={};
  const serve=d=>{b={x:W/2,y:H/2,vx:240*d,vy:Math.random()*160-80}};
  serve(1);
  const mv=e=>{py=k.pos(c,e).y};
  k.on(c,'pointermove',mv);k.on(c,'pointerdown',mv);
  k.key(d=>{keys[d]=1},d=>{keys[d]=0});
  const draw=()=>{
    x.fillStyle='#0F0B2E';x.fillRect(0,0,W,H);
    x.fillStyle='rgba(255,255,255,.18)';for(let y=8;y<H;y+=24)x.fillRect(W/2-2,y,4,12);
    x.fillStyle='#35E0D0';x.beginPath();x.roundRect(8,py-ph/2,8,ph,4);x.fill();
    x.fillStyle='#FF4F8B';x.beginPath();x.roundRect(W-16,ay-ph/2,8,ph,4);x.fill();
    x.fillStyle='#FFC83D';x.beginPath();x.arc(b.x,b.y,6,0,7);x.fill();
    x.fillStyle='#FFF4DC';x.font='700 16px sans-serif';x.textAlign='left';x.textBaseline='top';
    x.fillText('Lives '+'♥'.repeat(3-miss),W/2-120,8);
  };
  k.loop(dt=>{
    if(keys.ArrowUp)py-=320*dt;if(keys.ArrowDown)py+=320*dt;
    py=clamp(py,ph/2,H-ph/2);
    const as=Math.min(260,170+sc*8);
    ay+=clamp(b.y-ay,-as*dt,as*dt);ay=clamp(ay,ph/2,H-ph/2);
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y<6){b.y=6;b.vy=Math.abs(b.vy)}
    if(b.y>H-6){b.y=H-6;b.vy=-Math.abs(b.vy)}
    if(b.vx<0&&b.x<22&&b.x>8&&Math.abs(b.y-py)<ph/2+6){b.vx=Math.min(520,Math.abs(b.vx)*1.06);b.vy+=(b.y-py)*4;beep(420,.04)}
    if(b.vx>0&&b.x>W-22&&b.x<W-8&&Math.abs(b.y-ay)<ph/2+6){b.vx=-Math.min(520,Math.abs(b.vx)*1.04);b.vy+=(b.y-ay)*3;beep(320,.04)}
    b.vy=clamp(b.vy,-380,380);
    if(b.x<-10){miss++;beep(150,.2);if(miss>=3){draw();return k.over('The computer won')}serve(1)}
    if(b.x>W+10){sc++;k.score(sc);beep(760,.08);serve(-1)}
    draw();
  });
}

/* 3. Tic-Tac-Toe */
function ttt(k){
  const el=k.el;
  el.innerHTML='<p class="msg" id="tm">Your move. You are X.</p><div class="ttt"></div>';
  const bd=el.querySelector('.ttt'),tm=el.querySelector('#tm');
  let b=Array(9).fill(''),lock=false,sc=0;
  const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const win=b=>{for(const l of L)if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[0]]===b[l[2]])return b[l[0]];return b.every(Boolean)?'d':null};
  const mm=(b,p)=>{
    const w=win(b);if(w==='O')return 1;if(w==='X')return -1;if(w==='d')return 0;
    let best=p==='O'?-2:2;
    for(let i=0;i<9;i++)if(!b[i]){b[i]=p;const s=mm(b,p==='O'?'X':'O');b[i]='';best=p==='O'?Math.max(best,s):Math.min(best,s)}
    return best;
  };
  const ai=()=>{
    const e=b.map((v,i)=>v?-1:i).filter(i=>i>=0);
    if(Math.random()<.3)return e[Math.random()*e.length|0];
    let bi=e[0],bs=-2;
    for(const i of e){b[i]='O';const s=mm(b,'X');b[i]='';if(s>bs){bs=s;bi=i}}
    return bi;
  };
  const cells=[...Array(9)].map((_,i)=>{const n=document.createElement('button');n.className='tc';n.setAttribute('aria-label','Cell '+(i+1));n.onclick=()=>play(i);bd.appendChild(n);return n});
  const draw=()=>cells.forEach((n,i)=>{n.textContent=b[i];n.className='tc '+b[i].toLowerCase()});
  const next=msg=>{lock=true;tm.textContent=msg;k.timeout(()=>{b=Array(9).fill('');lock=false;draw();tm.textContent='New round. Your move.'},1100)};
  const result=w=>{
    if(w==='X'){sc+=10;k.score(sc);beep(700,.1);next('You won the round! +10');return true}
    if(w==='d'){sc+=3;k.score(sc);next('Draw. +3');return true}
    if(w==='O'){lock=true;k.over('The computer won this round');return true}
    return false;
  };
  const play=i=>{
    if(lock||b[i])return;
    b[i]='X';draw();beep(520,.05);lock=true;
    if(result(win(b)))return;
    tm.textContent='Computer is thinking…';
    k.timeout(()=>{b[ai()]='O';draw();beep(330,.05);lock=false;if(result(win(b)))return;tm.textContent='Your move.'},350);
  };
}

/* 4. Memory Match */

}

/* 5. Flap */
function flap(k){
  const W=360,H=520,{c,x}=k.canvas(W,H);
  let y=H/2,vy=0,pipes=[],t=0,sc=0,started=false,off=0;

    x.fillStyle='#fff';x.beginPath();x.arc(5,-4,4.5,0,7);x.fill();
    x.fillStyle='#1A1147';x.beginPath();x.arc(6.5,-4,2,0,7);x.fill();
    x.fillStyle='#FF8A3D';x.fillRect(10,2,9,5);
    x.restore();
    if(!started){x.fillStyle='#fff';x.font='700 18px sans-serif';x.textAlign='center';x.fillText('Tap to flap',W/2,H/2+60)}
  };
  const die=()=>{draw();k.over('You hit something')};
  k.loop(dt=>{
    if(started){
      off+=130*dt;vy+=900*dt;y+=vy*dt;t+=dt;
      if(t>1.5){t=0;pipes.push({x:W+20,gy:70+Math.random()*190,p:false})}
      pipes.forEach(p=>p.x-=130*dt);
      pipes=pipes.filter(p=>p.x>-70);
      for(const p of pipes){
        if(!p.p&&p.x+50<90){p.p=true;sc++;k.score(sc);beep(880,.05)}
        if(90+12>p.x&&90-12<p.x+50&&(y-12<p.gy||y+12>p.gy+150))return die();
      }
      if(y>H-40-12||y<0)return die();
    }else y=H/2+Math.sin(performance.now()/200)*8;

/* 6. Breakout */
function breakout(k){
  const W=360,H=480,{c,x}=k.canvas(W,H),cols=8,rows=6,bw=W/cols,bh=20,pw=72;
  const colors=['#FF4F8B','#FF8A3D','#FFC83D','#7BE06B','#35E0D0','#8F7BFF'];
  let px=W/2,lives=3,sc=0,lvl=0,bricks,on=false;const ball={x:0,y:0,vx:0,vy:0},keys={};
  const build=()=>{bricks=[];for(let r=0;r<rows;r++)for(let i=0;i<cols;i++)bricks.push({x:i*bw+2,y:60+r*(bh+4),w:bw-4,h:bh,c:colors[r],a:true})};
  const reset=()=>{on=false;ball.x=px;ball.y=H-40;ball.vx=ball.vy=0};
  const launch=()=>{if(on)return;on=true;const sp=300+lvl*40;ball.vx=sp*.35;ball.vy=-sp*.94};
  build();reset();
  const mv=e=>{px=clamp(k.pos(c,e).x,pw/2,W-pw/2)};
  k.on(c,'pointermove',mv);k.on(c,'pointerdown',e=>{mv(e);launch()});
  k.key(d=>{keys[d]=1;if(d===' ')launch()},d=>{keys[d]=0});
  const draw=()=>{
    x.fillStyle='#0F0B2E';x.fillRect(0,0,W,H);
    bricks.forEach(b=>{if(b.a){x.fillStyle=b.c;x.beginPath();x.roundRect(b.x,b.y,b.w,b.h,4);x.fill()}});
    x.fillStyle='#FFF4DC';x.beginPath();x.roundRect(px-pw/2,H-30,pw,10,5);x.fill();
    x.fillStyle='#FFC83D';x.beginPath();x.arc(ball.x,ball.y,6,0,7);x.fill();
    x.fillStyle='#FFF4DC';x.font='700 15px sans-serif';x.textAlign='left';x.textBaseline='top';
    x.fillText('Lives '+'♥'.repeat(lives)+'   Level '+(lvl+1),10,10);
    if(!on){x.textAlign='center';x.fillText('Tap or press Space to launch',W/2,H/2+80)}
  };
  k.loop(dt=>{
    if(keys.ArrowLeft)px-=380*dt;if(keys.ArrowRight)px+=380*dt;
    px=clamp(px,pw/2,W-pw/2);
    if(!on){ball.x=px;ball.y=H-40}
    else{
      const oy=ball.y;
      ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
      if(ball.x<6){ball.x=6;ball.vx=Math.abs(ball.vx)}
      if(ball.x>W-6){ball.x=W-6;ball.vx=-Math.abs(ball.vx)}
      if(ball.y<6){ball.y=6;ball.vy=Math.abs(ball.vy)}
      if(ball.vy>0&&ball.y+6>=H-30&&oy+6<=H-28&&Math.abs(ball.x-px)<=pw/2+6){
        const sp=Math.min(560,Math.hypot(ball.vx,ball.vy)*1.01),a=clamp((ball.x-px)/(pw/2),-1,1)*1.05;
        ball.vx=sp*Math.sin(a);ball.vy=-sp*Math.cos(a);ball.y=H-36;beep(300,.04);
      }
      for(const b of bricks){
        if(!b.a)continue;
        if(ball.x+6>b.x&&ball.x-6<b.x+b.w&&ball.y+6>b.y&&ball.y-6<b.y+b.h){
          b.a=false;
          if(oy+6<=b.y||oy-6>=b.y+b.h)ball.vy*=-1;else ball.vx*=-1;
          sc+=10;k.score(sc);beep(500+Math.random()*300,.04);break;
        }
      }
      if(bricks.every(b=>!b.a)){lvl++;sc+=50;k.score(sc);build();reset()}
      if(ball.y>H+10){lives--;beep(150,.2);if(lives<=0){draw();return k.over('Out of lives')}reset()}
    }
    draw();
  });
}

/* 8. 2048 */
function g2048(k){
  const el=k.el;el.innerHTML='<div class="g2048"></div>';
  const bd=el.firstChild;let g=Array(16).fill(0),sc=0;
  const cells=[...Array(16)].map(()=>{const d=document.createElement('div');d.className='t';bd.appendChild(d);return d});
  const pal={0:['#2E2470','#fff'],2:['#FFF4DC','#3a2a6a'],4:['#FFE3A8','#3a2a6a'],8:['#FFB24D','#fff'],16:['#FF8A3D','#fff'],32:['#FF6A5B','#fff'],64:['#FF4F8B','#fff'],128:['#C04FFF','#fff'],256:['#8F7BFF','#fff'],512:['#4FA3FF','#fff'],1024:['#35E0D0','#0F0B2E'],2048:['#FFC83D','#3a2a6a']};
  const draw=()=>cells.forEach((d,i)=>{
    const v=g[i],p=pal[v]||['#FFC83D','#3a2a6a'];
    d.textContent=v||'';d.style.background=p[0];d.style.color=p[1];
    d.style.fontSize=v>=1024?'1.2rem':v>=128?'1.5rem':'1.9rem';
  });
  const add=()=>{const e=g.map((v,i)=>v?-1:i).filter(i=>i>=0);if(e.length)g[e[Math.random()*e.length|0]]=Math.random()<.9?2:4};
  const line=a=>{
    const r=a.filter(Boolean);let gain=0;
    for(let i=0;i<r.length-1;i++)if(r[i]===r[i+1]){r[i]*=2;gain+=r[i];r.splice(i+1,1)}
    while(r.length<4)r.push(0);
    return[r,gain];
  };
  const canMove=()=>g.some((v,i)=>!v||(i%4<3&&v===g[i+1])||(i<12&&v===g[i+4]));
  const move=d=>{
    let moved=false,gain=0;const ng=g.slice();
    for(let i=0;i<4;i++){
      const idx=[0,1,2,3].map(j=>d<2?i*4+j:j*4+i);
      if(d===1||d===3)idx.reverse();
      const[r,gn]=line(idx.map(p=>g[p]));gain+=gn;
      idx.forEach((p,j)=>{if(ng[p]!==r[j])moved=true;ng[p]=r[j]});
    }
    if(!moved)return;
    g=ng;sc+=gain;add();draw();k.score(sc);beep(gain?600:300,.04);
    if(!canMove())k.over('No moves left');
  };
  const D={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3,left:0,right:1,up:2,down:3};
  k.key(d=>{if(d in D)move(D[d])});
  let sx=0,sy=0;
  k.on(bd,'pointerdown',e=>{sx=e.clientX;sy=e.clientY});
  k.on(bd,'pointerup',e=>{
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
    move(Math.abs(dx)>Math.abs(dy)?(dx>0?1:0):(dy>0?3:2));
  });
  add();add();draw();
}

/* 12. Quick Draw */
function reflex(k){
  const el=k.el;const pad=document.createElement('button');pad.className='qd';el.appendChild(pad);
  let round=0,times=[],phase='idle',t0=0,tm=0;
  const setP=(cls,txt,sub)=>{pad.className='qd '+cls;pad.innerHTML='<b>'+txt+'</b><span>'+(sub||'')+'</span>'};
  const begin=()=>{
    phase='wait';setP('red','Wait…','Tap when it turns green');
    tm=k.timeout(()=>{phase='go';t0=performance.now();setP('green','Tap now!','')},1200+Math.random()*2400);
  };
  const tap=()=>{
    if(phase==='idle'){begin();return}
    if(phase==='wait'){clearTimeout(tm);phase='idle';setP('blue','Too soon!','Tap to try this round again');beep(150,.2);return}
    if(phase==='go'){
      const ms=Math.round(performance.now()-t0);times.push(ms);round++;beep(700,.06);
      if(round>=5){const avg=Math.round(times.reduce((a,b)=>a+b)/5);k.score(Math.max(0,1000-avg));return k.over('Average reaction: '+avg+' ms')}
      phase='idle';setP('blue',ms+' ms','Round '+round+' of 5 done. Tap for the next one');
    }
  };
  setP('blue','Tap to start','5 rounds. Wait for green, then tap fast.');
  pad.addEventListener('pointerdown',e=>{e.preventDefault();tap()});
  k.key(d=>{if(d===' ')tap()});
}

/* ======================= HOME PAGE ======================= */
let filter='All';
const grid=$('#grid');
function render(){
  grid.innerHTML='';
  GAMES.filter(g=>filter==='All'||g.tag===filter).forEach(g=>{
    const b=document.createElement('button');b.className='cab';b.style.setProperty('--c',g.color);
    const bs=best(g.id);
    b.innerHTML='<span class="scr"><span class="ico" aria-hidden="true">'+g.icon+'</span></span>'
      +'<span class="nm">'+g.name+'</span><span class="ds">'+g.desc+'</span>'
      +'<span class="ft"><span class="tag">'+g.tag+'</span><span>'+(bs?'Best '+bs:'Not played yet')+'</span></span>';
    b.onclick=()=>openGame(g);
    grid.appendChild(b);
  });
}
const chips=$('#chips');
['All','Classic','Puzzle','Action','Reflex'].forEach(f=>{
  const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=f;
  b.setAttribute('aria-pressed',f===filter);
  b.onclick=()=>{filter=f;chips.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b));render()};
  chips.appendChild(b);
});
$('#count').textContent=GAMES.length;
render();
</script>
